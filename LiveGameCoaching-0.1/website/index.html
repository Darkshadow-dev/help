<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Live Game Coaching</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="landing">
  <main class="landing-card">
    <div class="brand-mark">LGC</div>
    <p class="eyebrow">PLAY TOGETHER · LEARN TOGETHER</p>
    <h1>Live Game<br><span>Coaching</span></h1>
    <p class="intro">Watch someone's mobile gameplay live and help them improve — directly from your browser.</p>
    <form id="join-form">
      <label for="room-code">Private room code</label>
      <input id="room-code" maxlength="6" autocomplete="off" placeholder="E.G. A7K92F" required>
      <button class="primary" type="submit">Join live room</button>
    </form>
    <p id="landing-status" class="status" role="status">You only need a browser to coach.</p>
    <div class="landing-foot">Private rooms · No coach app · No account in 0.1</div>
  </main>
  <script src="/js/home.js"></script>
</body>
</html>
